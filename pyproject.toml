[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: calls TinyFish or Gemini for real (needs keys in .env, may cost credits)",
    "slow: runs ffmpeg / whisper on the sample clip",
]
addopts = "-m 'not live'"
