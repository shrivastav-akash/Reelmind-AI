[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: calls TinyFish or Gemini for real (needs keys in .env, may cost credits)",
    "slow: runs ffmpeg / whisper on the sample clip",
    "friday: defines done for code built on Fri 30 Oct; fails until then (run with -m friday)",
]
addopts = "-m 'not live and not friday'"
